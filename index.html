<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thư Viện Sơ Đồ Tư Duy Địa Lí 12</title>
  <style>
    :root {
      --bg-main: #f4f7f5;
      --bg-card: #ffffff;
      --bg-node: #ffffff;
      --text-main: #1e293b;
      --text-muted: #475569;
      --border-color: #cbd5e1;
      --primary: #0f766e;      /* Ngọc bích */
      --primary-light: #ccfbf1;
      --secondary: #1d4ed8;    /* Thanh lam */
      --secondary-light: #dbeafe;
      --accent: #b45309;       /* Vàng đồng */
      --accent-light: #fef3c7;
      --rose: #be123c;
      --rose-light: #ffe4e6;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
      --line-color: #94a3b8;
    }

    body.dark {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-node: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #cbd5e1;
      --border-color: #334155;
      --primary: #2dd4bf;
      --primary-light: rgba(45, 212, 191, 0.15);
      --secondary: #60a5fa;
      --secondary-light: rgba(96, 165, 250, 0.15);
      --accent: #fbbf24;
      --accent-light: rgba(251, 191, 36, 0.15);
      --rose: #fb7185;
      --rose-light: rgba(251, 113, 133, 0.15);
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      --line-color: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      transition: background-color 0.25s, color 0.25s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-icon {
      font-size: 26px;
    }

    .brand-title h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.3px;
    }

    .brand-title p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      padding: 8px 14px 8px 34px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--bg-main);
      color: var(--text-main);
      font-size: 13.5px;
      width: 220px;
      outline: none;
      transition: border-color 0.2s, width 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      width: 260px;
    }

    .search-box span {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--text-muted);
    }

    button {
      padding: 8px 13px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    button:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    button.primary-btn {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      font-weight: 600;
    }

    button.primary-btn:hover {
      color: #ffffff;
      opacity: 0.92;
    }

    button.active-edit {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    button.active-edit:hover {
      color: #ffffff;
      opacity: 0.92;
    }

    button.layout-active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }

    .save-status {
      font-size: 12.5px;
      color: var(--primary);
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--primary-light);
    }

    /* Home Library Grid */
    #library-view {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 28px 20px;
      flex: 1;
    }

    .section-header {
      margin-bottom: 22px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 12px;
    }

    .section-header h2 {
      font-size: 22px;
      font-weight: 700;
    }

    .section-header p {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .section-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .lesson-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 22px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .lesson-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
    }

    .lesson-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
    }

    .card-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .card-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary);
      width: fit-content;
    }

    .card-del-btn {
      padding: 3px 8px;
      font-size: 11.5px;
      border-radius: 6px;
      border-color: transparent;
      background: transparent;
      color: var(--text-muted);
    }

    .card-del-btn:hover {
      border-color: var(--rose);
      background: var(--rose-light);
      color: var(--rose);
    }

    .lesson-card h3 {
      font-size: 18px;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .lesson-card p {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 18px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px dashed var(--border-color);
      font-size: 13px;
      color: var(--primary);
      font-weight: 600;
    }

    /* Mindmap Workspace */
    #mindmap-view {
      display: none;
      flex: 1;
      flex-direction: column;
      height: calc(100vh - 65px);
    }

    .mindmap-topbar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .mindmap-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .mindmap-title-group h2 {
      font-size: 16.5px;
      font-weight: 700;
    }

    .canvas-container {
      flex: 1;
      overflow: auto;
      padding: 44px;
      background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
      background-size: 24px 24px;
      position: relative;
    }

    /* Tree Layout - CHẾ ĐỘ NGANG (TRÁI -> PHẢI) */
    .tree {
      display: inline-flex;
      align-items: center;
      min-width: max-content;
    }

    .node-wrapper {
      display: flex;
      align-items: center;
    }

    .node-box {
      background: var(--bg-node);
      border: 2px solid var(--border-color);
      border-radius: 13px;
      padding: 12px 16px;
      max-width: 340px;
      min-width: 185px;
      box-shadow: var(--shadow);
      position: relative;
      transition: all 0.2s;
      cursor: pointer;
    }

    .node-box:hover {
      transform: scale(1.015);
    }

    .node-box.highlight {
      outline: 3px solid #f59e0b;
      background: var(--accent-light);
    }

    body.edit-mode .node-box {
      cursor: default;
    }

    body.edit-mode .node-box:hover {
      transform: none;
    }

    [contenteditable="true"] {
      outline: 1.5px dashed rgba(180, 83, 9, 0.55);
      border-radius: 6px;
      padding: 2px 4px;
      cursor: text;
      transition: background-color 0.15s, outline-color 0.15s;
    }

    [contenteditable="true"]:focus {
      outline: 2px solid var(--accent);
      background: var(--accent-light);
    }

    .level-0 > .node-box [contenteditable="true"]:focus {
      color: var(--text-main);
    }

    /* Node builder actions */
    .node-actions {
      display: none;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 9px;
      padding-top: 7px;
      border-top: 1px dashed var(--border-color);
    }

    body.edit-mode .node-actions {
      display: flex;
    }

    .level-0 > .node-box .node-actions {
      border-top-color: rgba(255, 255, 255, 0.35);
    }

    .mini-act-btn {
      padding: 3px 7px;
      font-size: 11px;
      border-radius: 6px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      background: var(--bg-main);
      color: var(--text-main);
    }

    .level-0 > .node-box .mini-act-btn {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.35);
    }

    .level-0 > .node-box .mini-act-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      color: #ffffff;
    }

    .mini-act-btn.add-child:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }

    .mini-act-btn.del-node:hover {
      border-color: var(--rose);
      color: var(--rose);
      background: var(--rose-light);
    }

    /* Level Styling */
    .level-0 > .node-box {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #ffffff;
      border: none;
      padding: 18px 24px;
      max-width: 300px;
      text-align: center;
    }

    .level-0 > .node-box .node-title {
      font-size: 16px;
      font-weight: 700;
    }

    .level-1 > .node-box {
      border-left: 5px solid var(--primary);
      background: var(--bg-card);
    }

    .level-1.branch-1 > .node-box { border-left-color: var(--secondary); }
    .level-1.branch-2 > .node-box { border-left-color: var(--accent); }
    .level-1.branch-3 > .node-box { border-left-color: var(--rose); }
    .level-1.branch-4 > .node-box { border-left-color: var(--primary); }
    .level-1.branch-5 > .node-box { border-left-color: var(--secondary); }
    .level-1.branch-6 > .node-box { border-left-color: var(--accent); }

    .level-1 > .node-box .node-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--primary);
    }
    .level-1.branch-1 > .node-box .node-title { color: var(--secondary); }
    .level-1.branch-2 > .node-box .node-title { color: var(--accent); }
    .level-1.branch-3 > .node-box .node-title { color: var(--rose); }
    .level-1.branch-4 > .node-box .node-title { color: var(--primary); }
    .level-1.branch-5 > .node-box .node-title { color: var(--secondary); }
    .level-1.branch-6 > .node-box .node-title { color: var(--accent); }

    .level-2 > .node-box {
      border-color: var(--border-color);
      padding: 10px 14px;
    }

    .level-2 > .node-box .node-title {
      font-size: 13.5px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .level-3 > .node-box {
      border-width: 1.5px;
      padding: 10px 14px;
      max-width: 350px;
    }

    .node-title {
      line-height: 1.38;
    }

    .node-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.58;
      margin-top: 6px;
    }

    .node-desc p {
      margin-bottom: 7px;
    }

    .node-desc p:last-child {
      margin-bottom: 0;
    }

    .node-desc ul, .node-desc ol {
      padding-left: 17px;
      margin-top: 4px;
    }

    .node-desc li {
      margin-bottom: 6px;
    }

    .node-desc li:last-child {
      margin-bottom: 0;
    }

    .toggle-btn {
      position: absolute;
      right: -12px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg-card);
      z-index: 5;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* Horizontal Connectors */
    .children-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 44px;
      position: relative;
    }

    .children-col.collapsed {
      display: none;
    }

    .child-item {
      display: flex;
      align-items: center;
      position: relative;
      padding: 11px 0;
    }

    .child-item::before {
      content: '';
      position: absolute;
      left: -44px;
      top: 50%;
      width: 44px;
      height: 2px;
      background: var(--line-color);
    }

    .child-item::after {
      content: '';
      position: absolute;
      left: -44px;
      width: 2px;
      background: var(--line-color);
      top: 0;
      bottom: 0;
    }

    .child-item:first-child::after {
      top: 50%;
    }

    .child-item:last-child::after {
      bottom: 50%;
    }

    .child-item:only-child::after {
      display: none;
    }

    /* ==================== CHẾ ĐỘ DỌC (TRÊN -> DƯỚI) ==================== */
    .tree.vertical {
      flex-direction: column;
      align-items: center;
    }

    .tree.vertical .node-wrapper {
      flex-direction: column;
      align-items: center;
    }

    .tree.vertical .node-box {
      max-width: 315px;
      min-width: 175px;
    }

    .tree.vertical .toggle-btn {
      right: 50%;
      top: auto;
      bottom: -12px;
      transform: translateX(50%);
    }

    .tree.vertical .children-col {
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      padding-left: 0;
      padding-top: 42px;
    }

    .tree.vertical .children-col.collapsed {
      display: none;
    }

    .tree.vertical .child-item {
      flex-direction: column;
      align-items: center;
      padding: 0 14px;
    }

    .tree.vertical .child-item::before {
      left: 50%;
      top: -42px;
      width: 2px;
      height: 42px;
      transform: translateX(-50%);
    }

    .tree.vertical .child-item::after {
      left: 0;
      right: 0;
      top: -42px;
      bottom: auto;
      width: auto;
      height: 2px;
    }

    .tree.vertical .child-item:first-child::after {
      left: 50%;
      right: 0;
      top: -42px;
      bottom: auto;
      width: auto;
      height: 2px;
    }

    .tree.vertical .child-item:last-child::after {
      left: 0;
      right: 50%;
      top: -42px;
      bottom: auto;
      width: auto;
      height: 2px;
    }

    .tree.vertical .child-item:first-child:last-child::after,
    .tree.vertical .child-item:only-child::after {
      display: none;
    }

    /* Mini Table inside node */
    .mini-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
      font-size: 12px;
    }
    .mini-table th, .mini-table td {
      border: 1px solid var(--border-color);
      padding: 6px 7px;
      text-align: left;
      vertical-align: top;
      line-height: 1.42;
    }
    .mini-table th {
      background: var(--primary-light);
      color: var(--text-main);
      font-weight: 700;
    }

    /* Modal Thêm Bài Mới */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .modal-box h3 {
      font-size: 18px;
      margin-bottom: 14px;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 13px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-main);
      color: var(--text-main);
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--primary);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    @media (max-width: 640px) {
      .search-box input { width: 150px; }
      .search-box input:focus { width: 185px; }
      .canvas-container { padding: 24px 16px; }
      .tree:not(.vertical) .children-col { padding-left: 30px; }
      .tree:not(.vertical) .child-item::before { left: -30px; width: 30px; }
      .tree:not(.vertical) .child-item::after { left: -30px; }
    }
  </style>
</head>
<body class="edit-mode">

  <header>
    <div class="brand" onclick="showLibrary()">
      <span class="brand-icon">📜</span>
      <div class="brand-title">
        <h1>THƯ VIỆN SƠ ĐỒ TƯ DUY</h1>
        <p>Địa Lí 12 • Ngang / Dọc, thêm bài &amp; tự dựng sơ đồ</p>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="globalSearch" placeholder="Tìm bài học hoặc từ khóa..." oninput="handleSearch(this.value)" />
      </div>
      <span class="save-status" id="saveStatus">Đã tự lưu</span>
      <button onclick="resetAllEdits()" title="Khôi phục nội dung gốc ban đầu">↺ Khôi phục gốc</button>
      <button onclick="toggleTheme()" id="themeBtn">🌙 Chế độ tối</button>
    </div>
  </header>

  <!-- DANH SÁCH CÁC BÀI HỌC -->
  <main id="library-view">
    <div class="section-header">
      <div>
        <h2>📚 Danh mục Bí kíp Địa Lí</h2>
        <p>Chọn bài học để mở sơ đồ tư duy — hoặc tự tạo bài mới và thêm nhánh ngay bên trong bài</p>
      </div>
      <div class="section-actions">
        <span id="lessonCount" style="font-size: 13.5px; color: var(--primary); font-weight: 600;"></span>
        <button class="primary-btn" onclick="openAddLessonModal()">➕ Thêm bài mới</button>
      </div>
    </div>

    <div class="cards-grid" id="cardsGrid"></div>
  </main>

  <!-- KHÔNG GIAN XEM SƠ ĐỒ TƯ DUY -->
  <section id="mindmap-view">
    <div class="mindmap-topbar">
      <div class="mindmap-title-group">
        <button onclick="showLibrary()">⬅ Danh sách bài</button>
        <h2 id="currentLessonTitle">Tên bài học</h2>
      </div>
      <div class="toolbar">
        <button onclick="setLayout('horizontal')" id="btnHorizontal" class="layout-active">↔ Mẫu Ngang</button>
        <button onclick="setLayout('vertical')" id="btnVertical">↕ Mẫu Dọc</button>
        <button onclick="toggleEditMode()" id="editModeBtn" class="active-edit">✏️ Đang bật sửa &amp; dựng</button>
        <button onclick="expandAll(true)">➕ Mở rộng tất cả</button>
        <button onclick="expandAll(false)">➖ Thu gọn nhánh</button>
        <button onclick="zoomCanvas(0.1)">🔍+</button>
        <button onclick="zoomCanvas(-0.1)">🔍-</button>
        <button onclick="resetZoom()">100%</button>
      </div>
    </div>

    <div class="canvas-container" id="canvasContainer">
      <div class="tree" id="mindmapTree"></div>
    </div>
  </section>

  <!-- MODAL THÊM BÀI MỚI -->

                  desc: "<ul><li><strong>Thủy điện:</strong> Hệ thống sông ở Tây Bắc, Nam Trung Bộ, Đông Nam Bộ (sông Hồng, Xê-xan, Đồng Nai).</li><li><strong>Nhiệt điện:</strong> Trữ lượng than đá, dầu mỏ, khí tự nhiên lớn.</li><li><strong>Năng lượng tái tạo (điện mặt trời, điện gió):</strong> Khí hậu nhiệt đới gió mùa, mùa khô dài ở DH Nam Trung Bộ và Nam Bộ.</li><li><strong>Nguồn cung chủ yếu:</strong> Miền Bắc (thủy điện, nhiệt điện than); Miền Trung (điện gió, điện mặt trời); Miền Nam &amp; Nam Trung Bộ (thủy điện, nhiệt điện khí, điện gió, điện mặt trời).</li></ul>"
                },
                {
                  title: "2. Cơ cấu sản lượng điện (2010 – 2023)",
                  desc: "<ul><li><strong>Nhiệt điện:</strong> Chiếm tỉ trọng lớn nhất nhưng có xu hướng giảm gần đây (56% năm 2010 → 56,2% năm 2021 → 43,5% năm 2023).</li><li><strong>Thủy điện:</strong> Xu hướng giảm tỉ trọng (38% năm 2010 → 28,4% năm 2023).</li><li><strong>Năng lượng tái tạo:</strong> Tăng vọt (0% năm 2010 → 12,3% năm 2021 → 26,9% năm 2023).</li><li><strong>Nguồn khác:</strong> Giảm (6% năm 2010 → 0,9% năm 2021 → 1,2% năm 2023).</li></ul>"
                },
                {
                  title: "3. Các nhà máy điện lớn",
                  desc: "<ul><li><strong>Thủy điện:</strong> Sơn La, Phú Thọ, Lai Châu, Yaly, Huội Quảng, Trị An...</li><li><strong>Nhiệt điện than:</strong> Duyên Hải 1, Vũng Áng 1, Vĩnh Tân, Phả Lại, Quảng Ninh...</li><li><strong>Nhiệt điện khí:</strong> Phú Mỹ 1, Nhơn Trạch 2, Cà Mau 1, Ô Môn 1.</li><li><strong>Điện gió, mặt trời:</strong> Khánh Hòa, Đắk Lắk, Cà Mau...</li></ul>"
                },
                {
                  title: "4. Mạng lưới điện & hướng phát triển",
                  desc: "<ul><li><strong>Mạng lưới:</strong> Hệ thống 500 kV (dài và quan trọng nhất, tuyến chính từ Lai Châu đến Cần Thơ); Hệ thống 220 kV (kết nối hầu hết tỉnh thành).</li><li><strong>Hướng phát triển:</strong> Cải tiến kĩ thuật, nâng cấp công nghệ, giảm phát thải CO₂, chuyển dịch sang năng lượng sạch và tái tạo.</li></ul>"
                }
              ]
            },
            {
              title: "Nhánh 3: Điện tử, máy vi tính",
              desc: "<ul><li><strong>Điều kiện:</strong> Lao động trẻ, trình độ ngày càng cao, KH-CN, chính sách phát triển và hội nhập.</li><li><strong>Đặc điểm:</strong> Ngành công nghiệp trẻ (phát triển mạnh từ năm 2000 đến nay); sản phẩm đa dạng; đẩy mạnh nghiên cứu, ứng dụng KH-CN.</li><li><strong>Phân bố:</strong> Các đô thị lớn như Hà Nội, Hải Phòng, TP. Hồ Chí Minh...</li></ul>"
            },
            {
              title: "Nhánh 4: Sản xuất, chế biến thực phẩm",
              desc: "<ul><li><strong>Điều kiện:</strong> Nguyên liệu trong nước phong phú, lao động dồi dào, thị trường tiêu thụ rộng lớn.</li><li><strong>Đặc điểm:</strong> Hình thành từ cuối thế kỉ XIX; sản phẩm đa dạng, sản lượng không ngừng tăng.</li><li><strong>Phân bố:</strong> Gần vùng nguyên liệu hoặc thị trường lớn (Hà Nội, Hải Phòng, Đà Nẵng, Khánh Hòa, TP. Hồ Chí Minh, Cần Thơ...).</li></ul>"
            },
            {
              title: "Nhánh 5: Sản xuất đồ uống",
              desc: "<ul><li><strong>Điều kiện:</strong> Nguyên liệu phong phú, nhu cầu thị trường ngày càng tăng.</li><li><strong>Đặc điểm:</strong> Cơ cấu đa dạng (nước tinh khiết, nước khoáng, bia...); ứng dụng rộng rãi KH-CN; có sự tham gia của các tập đoàn lớn trên thế giới.</li><li><strong>Phân bố:</strong> Chủ yếu ở các đô thị và gần nguồn nước khoáng.</li></ul>"
            },
            {
              title: "Nhánh 6: Dệt, may",
              desc: "<ul><li><strong>Điều kiện:</strong> Lao động dồi dào, thị trường rộng lớn, nguyên liệu trong nước phong phú.</li><li><strong>Đặc điểm:</strong> Hình thành khoảng thế kỉ XIX (các nhà máy dệt ở Ninh Bình, Hà Nội, TP. Hồ Chí Minh); sản phẩm đa dạng, sản lượng tăng, tự động hóa rộng rãi.</li><li><strong>Phân bố:</strong> Tập trung ở các đô thị lớn.</li></ul>"
            },
            {
              title: "Nhánh 7: Giày dép",
              desc: "<ul><li><strong>Đặc điểm:</strong> Phát triển nhanh (nhờ lao động, thị trường, nguyên liệu); giữ vị trí cao trên thế giới về sản xuất và xuất khẩu.</li><li><strong>Công nghệ:</strong> Ứng dụng phương thức hiện đại như đưa rô-bốt vào sản xuất, công nghệ in 3D...</li><li><strong>Phân bố:</strong> Rộng rãi khắp cả nước.</li></ul>"
            }
          ]
        }
      }
    ];

    let LESSONS = loadLessons();
    let currentScale = 1;
    let activeLesson = null;
    let isEditMode = true;
    let currentLayout = localStorage.getItem(LAYOUT_KEY) || "horizontal";

    function loadLessons() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      } catch (e) {}
      return JSON.parse(JSON.stringify(DEFAULT_LESSONS));
    }

    function saveLessons(showNotice = true) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(LESSONS));
        if (showNotice) {
          const badge = document.getElementById("saveStatus");
          badge.textContent = "✓ Đã lưu";
          clearTimeout(window._saveTimer);
          window._saveTimer = setTimeout(() => {
            badge.textContent = "Đã tự lưu";
          }, 1500);
        }
      } catch (e) {}
    }

    function setLayout(mode) {
      currentLayout = mode === "vertical" ? "vertical" : "horizontal";
      localStorage.setItem(LAYOUT_KEY, currentLayout);

      const tree = document.getElementById("mindmapTree");
      tree.classList.toggle("vertical", currentLayout === "vertical");

      document.getElementById("btnHorizontal").classList.toggle("layout-active", currentLayout === "horizontal");
      document.getElementById("btnVertical").classList.toggle("layout-active", currentLayout === "vertical");
      resetZoom();
    }

    function resetAllEdits() {
      if (confirm("Khôi phục toàn bộ bài học và sơ đồ về bản gốc ban đầu của sư phụ?")) {
        localStorage.removeItem(STORAGE_KEY);
        LESSONS = JSON.parse(JSON.stringify(DEFAULT_LESSONS));
        renderLibrary(document.getElementById("globalSearch").value);
        if (activeLesson) {
          const updated = LESSONS.find(l => l.id === activeLesson.id);
          if (updated) {
            openLesson(updated.id, document.getElementById("globalSearch").value.trim().toLowerCase());
          } else {
            showLibrary();
          }
        }
        document.getElementById("saveStatus").textContent = "Đã khôi phục gốc";
      }
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      document.body.classList.toggle("edit-mode", isEditMode);
      const btn = document.getElementById("editModeBtn");
      btn.classList.toggle("active-edit", isEditMode);
      btn.textContent = isEditMode ? "✏️ Đang bật sửa & dựng" : "👁️ Đang khóa sửa";

      document.querySelectorAll(".editable-field").forEach(el => {
        el.contentEditable = isEditMode ? "true" : "false";
      });
    }

    function openAddLessonModal() {
      document.getElementById("newLessonTitle").value = "";
      document.getElementById("newLessonBadge").value = "Bài tự tạo • Địa Lí 12";
      document.getElementById("newLessonRoot").value = "";
      document.getElementById("newLessonSummary").value = "";
      document.getElementById("addLessonModal").classList.add("open");
      setTimeout(() => document.getElementById("newLessonTitle").focus(), 40);
    }

    function closeAddLessonModal() {
      document.getElementById("addLessonModal").classList.remove("open");
    }

    function createNewLesson() {
      const titleInput = document.getElementById("newLessonTitle").value.trim();
      if (!titleInput) {
        alert("Đồ nhi nhập tên bài học trước nhé!");
        return;
      }

      const badgeInput = document.getElementById("newLessonBadge").value.trim() || "Bài tự tạo • Địa Lí 12";
      const rootInput = document.getElementById("newLessonRoot").value.trim() || titleInput.toUpperCase();
      const summaryInput = document.getElementById("newLessonSummary").value.trim() || "Sơ đồ tư duy do đồ nhi tự dựng và thêm nhánh.";

      const newId = "bai-custom-" + Date.now();
      const newLesson = {
        id: newId,
        badge: badgeInput,
        title: titleInput,
        summary: summaryInput,
        root: {
          title: rootInput,
          children: [
            {
              title: "Nhánh 1: Nội dung trọng tâm",
              desc: "<p>Bấm trực tiếp vào chữ để sửa hoặc bấm <strong>+ Nhánh con</strong> để vẽ tiếp sơ đồ.</p>",
              children: []
            }
          ]
        }
      };

      LESSONS.push(newLesson);
      saveLessons(true);
      closeAddLessonModal();
      openLesson(newId, document.getElementById("globalSearch").value.trim().toLowerCase());
    }

    function deleteLesson(lessonId, event) {
      event.stopPropagation();
      const target = LESSONS.find(l => l.id === lessonId);
      if (!target) return;
      if (!confirm(`Xóa bài "${target.title}" khỏi thư viện?`)) return;

      LESSONS = LESSONS.filter(l => l.id !== lessonId);
      saveLessons(true);
      renderLibrary(document.getElementById("globalSearch").value);
    }

    function renderLibrary(filterText = "") {
      const grid = document.getElementById("cardsGrid");
      const query = filterText.trim().toLowerCase();
      grid.innerHTML = "";

      const filtered = LESSONS.filter(lesson => {
        if (!query) return true;
        return JSON.stringify(lesson).toLowerCase().includes(query);
      });

      document.getElementById("lessonCount").textContent = `Hiện có ${filtered.length} bài học`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">
          Không tìm thấy bài học hoặc từ khóa phù hợp với "<strong>${filterText}</strong>".
        </div>`;
        return;
      }

      filtered.forEach(lesson => {
        const card = document.createElement("div");
        card.className = "lesson-card";
        card.onclick = () => openLesson(lesson.id, query);
        card.innerHTML = `
          <div>
            <div class="card-top-row">
              <span class="card-badge">${lesson.badge}</span>
              <button class="card-del-btn" title="Xóa bài này" onclick="deleteLesson('${lesson.id}', event)">🗑️ Xóa</button>
            </div>
            <h3>${lesson.title}</h3>
            <p>${lesson.summary}</p>
          </div>
          <div class="card-footer">
            <span>Mở sơ đồ tư duy</span>
            <span>➔</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function rerenderCurrentMindmap() {
      if (!activeLesson) return;
      const q = document.getElementById("globalSearch").value.trim().toLowerCase();
      const treeContainer = document.getElementById("mindmapTree");
      treeContainer.innerHTML = "";
      treeContainer.appendChild(createNodeElement(activeLesson.root, 0, 0, q, null, -1));
      treeContainer.classList.toggle("vertical", currentLayout === "vertical");
    }

    function createNodeElement(node, level = 0, branchIndex = 0, highlightQuery = "", parentChildren = null, childIndex = -1) {
      const wrapper = document.createElement("div");
      wrapper.className = `node-wrapper level-${level} branch-${branchIndex}`;

      const box = document.createElement("div");
      box.className = "node-box";

      if (highlightQuery) {
        const nodeText = ((node.title || "") + " " + (node.desc || "")).toLowerCase();
        if (nodeText.includes(highlightQuery)) {
          box.classList.add("highlight");
        }
      }

      const titleEl = document.createElement("div");
      titleEl.className = "node-title editable-field";
      titleEl.contentEditable = isEditMode ? "true" : "false";
      titleEl.innerHTML = node.title;
      titleEl.addEventListener("input", () => {
        node.title = titleEl.innerHTML;
        saveLessons(true);
      });
      titleEl.addEventListener("click", (e) => {
        if (isEditMode) e.stopPropagation();
      });
      box.appendChild(titleEl);

      if (node.desc !== undefined && node.desc !== null) {
        const descEl = document.createElement("div");
        descEl.className = "node-desc editable-field";
        descEl.contentEditable = isEditMode ? "true" : "false";
        descEl.innerHTML = node.desc;
        descEl.addEventListener("input", () => {
          node.desc = descEl.innerHTML;
          saveLessons(true);
        });
        descEl.addEventListener("click", (e) => {
          if (isEditMode) e.stopPropagation();
        });
        box.appendChild(descEl);
      }

      // Thanh dựng sơ đồ trực tiếp trên nhánh
      const actionsBar = document.createElement("div");
      actionsBar.className = "node-actions";

      const addChildBtn = document.createElement("button");
      addChildBtn.type = "button";
      addChildBtn.className = "mini-act-btn add-child";
      addChildBtn.textContent = "+ Nhánh con";
      addChildBtn.onclick = (e) => {
        e.stopPropagation();
        if (!Array.isArray(node.children)) node.children = [];
        node.children.push({
          title: "Nhánh mới",
          desc: "<p>Nhập nội dung...</p>"
        });
        saveLessons(true);
        rerenderCurrentMindmap();
      };
      actionsBar.appendChild(addChildBtn);

      if (node.desc === undefined || node.desc === null) {
        const addDescBtn = document.createElement("button");
        addDescBtn.type = "button";
        addDescBtn.className = "mini-act-btn";
        addDescBtn.textContent = "+ Ý/Mô tả";
        addDescBtn.onclick = (e) => {
          e.stopPropagation();
          node.desc = "<p>Nhập ghi chú...</p>";
          saveLessons(true);
          rerenderCurrentMindmap();
        };
        actionsBar.appendChild(addDescBtn);
      }

      if (level > 0 && Array.isArray(parentChildren) && childIndex > -1) {
        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "mini-act-btn del-node";
        delBtn.textContent = "× Xóa";
        delBtn.onclick = (e) => {
          e.stopPropagation();
          parentChildren.splice(childIndex, 1);
          saveLessons(true);
          rerenderCurrentMindmap();
        };
        actionsBar.appendChild(delBtn);
      }

      box.appendChild(actionsBar);
      wrapper.appendChild(box);

      if (node.children && node.children.length > 0) {
        const toggleBtn = document.createElement("span");
        toggleBtn.className = "toggle-btn";
        toggleBtn.textContent = "−";
        box.appendChild(toggleBtn);

        const childrenCol = document.createElement("div");
        childrenCol.className = "children-col";

        node.children.forEach((child, idx) => {
          const childItem = document.createElement("div");
          childItem.className = "child-item";
          const nextBranch = level === 0 ? idx : branchIndex;
          childItem.appendChild(createNodeElement(child, level + 1, nextBranch, highlightQuery, node.children, idx));
          childrenCol.appendChild(childItem);
        });

        const toggleAction = (e) => {
          e.stopPropagation();
          const isCollapsed = childrenCol.classList.toggle("collapsed");
          toggleBtn.textContent = isCollapsed ? "+" : "−";
        };

        toggleBtn.onclick = toggleAction;
        box.onclick = (e) => {
          if (!isEditMode) toggleAction(e);
        };

        wrapper.appendChild(childrenCol);
      }

      return wrapper;
    }

    function openLesson(lessonId, highlightQuery = "") {
      activeLesson = LESSONS.find(l => l.id === lessonId);
      if (!activeLesson) return;

      document.getElementById("library-view").style.display = "none";
      document.getElementById("mindmap-view").style.display = "flex";
      document.getElementById("currentLessonTitle").textContent = activeLesson.title;

      const treeContainer = document.getElementById("mindmapTree");
      treeContainer.innerHTML = "";
      treeContainer.appendChild(createNodeElement(activeLesson.root, 0, 0, highlightQuery, null, -1));
      setLayout(currentLayout);
    }

    function showLibrary() {
      activeLesson = null;
      document.getElementById("mindmap-view").style.display = "none";
      document.getElementById("library-view").style.display = "block";
      renderLibrary(document.getElementById("globalSearch").value);
    }

    function handleSearch(val) {
      const q = val.trim().toLowerCase();
      if (activeLesson) {
        rerenderCurrentMindmap();
      } else {
        renderLibrary(val);
      }
    }

    function expandAll(expand) {
      document.querySelectorAll(".children-col").forEach(col => {
        if (expand) col.classList.remove("collapsed");
        else col.classList.add("collapsed");
      });
      document.querySelectorAll(".toggle-btn").forEach(btn => {
        btn.textContent = expand ? "−" : "+";
      });
    }

    function zoomCanvas(delta) {
      currentScale = Math.min(1.5, Math.max(0.55, +(currentScale + delta).toFixed(2)));
      const tree = document.getElementById("mindmapTree");
      tree.style.transform = `scale(${currentScale})`;
      tree.style.transformOrigin = "top left";
    }

    function resetZoom() {
      currentScale = 1;
      const tree = document.getElementById("mindmapTree");
      tree.style.transform = "scale(1)";
    }

    function toggleTheme() {
      const isDark = document.body.classList.toggle("dark");
      document.getElementById("themeBtn").textContent = isDark ? "☀️ Chế độ sáng" : "🌙 Chế độ tối";
    }

    renderLibrary();
  </script>
</body>
</html>
